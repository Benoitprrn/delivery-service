<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recette — commerçant</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0; padding: 2rem; max-width: 52rem; }
      h1 { margin-top: 0; }
      form, section { margin-block: 1.5rem; padding: 1rem; border: 1px solid #8886; border-radius: .5rem; }
      label { display: block; margin-block: .75rem .25rem; font-weight: 600; }
      input, button { box-sizing: border-box; font: inherit; padding: .55rem; }
      input { width: 100%; }
      button { cursor: pointer; margin-top: 1rem; }
      .readonly { background: #8882; }
      pre { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
      #socket-status { font-weight: 600; }
      #socket-log { max-height: 18rem; overflow: auto; }
    </style>
  </head>
  <body>
    <h1>Recette commerçant</h1>
    <p id="socket-status" aria-live="polite">Socket.io : connexion…</p>

    <form id="order-form">
      <label for="merchant-id">merchant_id</label>
      <input id="merchant-id" value="22222222-2222-2222-2222-222222222222" required>

      <label for="zone-id">zone_id <small>(informatif ; utilisé uniquement pour Socket.io)</small></label>
      <input id="zone-id" value="11111111-1111-1111-1111-111111111111" required>

      <section aria-labelledby="pickup-title">
        <h2 id="pickup-title">Point de collecte <small>(lecture seule)</small></h2>
        <label for="pickup-address">Adresse</label>
        <input id="pickup-address" class="readonly" value="Place de la Grenette, 01000 Bourg-en-Bresse" readonly>
        <label for="pickup-lat">Latitude</label>
        <input id="pickup-lat" class="readonly" value="46.2058" readonly>
        <label for="pickup-lng">Longitude</label>
        <input id="pickup-lng" class="readonly" value="5.2255" readonly>
      </section>

      <label for="delivery-address">Adresse de livraison</label>
      <input id="delivery-address" value="10 Avenue Alsace-Lorraine, 01000 Bourg-en-Bresse" required>

      <label for="delivery-lat">Latitude de livraison</label>
      <input id="delivery-lat" type="number" step="any" value="46.21" required>

      <label for="delivery-lng">Longitude de livraison</label>
      <input id="delivery-lng" type="number" step="any" value="5.23" required>

      <button type="submit">Créer la commande</button>
    </form>

    <section>
      <h2>Résultat HTTP</h2>
      <pre id="result">Aucune requête envoyée.</pre>
    </section>

    <section>
      <h2>Journal Socket.io</h2>
      <pre id="socket-log">En attente d’événements…</pre>
    </section>

    <script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>
    <script>
      const API_URL = 'http://localhost:3000';
      const form = document.querySelector('#order-form');
      const merchantIdInput = document.querySelector('#merchant-id');
      const zoneIdInput = document.querySelector('#zone-id');
      const deliveryAddressInput = document.querySelector('#delivery-address');
      const deliveryLatInput = document.querySelector('#delivery-lat');
      const deliveryLngInput = document.querySelector('#delivery-lng');
      const result = document.querySelector('#result');
      const socketStatus = document.querySelector('#socket-status');
      const socketLog = document.querySelector('#socket-log');
      let socket;

      function appendSocketLog(eventName, payload) {
        const line = `[${new Date().toLocaleTimeString('fr-FR')}] ${eventName}\n${JSON.stringify(payload, null, 2)}`;
        socketLog.textContent = socketLog.textContent === 'En attente d’événements…'
          ? line
          : `${socketLog.textContent}\n\n${line}`;
        socketLog.scrollTop = socketLog.scrollHeight;
      }

      function connectSocket() {
        socket?.disconnect();
        socketStatus.textContent = 'Socket.io : connexion…';
        socket = io(API_URL, {
          query: { zoneId: zoneIdInput.value.trim() },
          transports: ['websocket']
        });
        socket.on('connect', () => {
          socketStatus.textContent = `Socket.io : connecté à la zone ${zoneIdInput.value.trim()}`;
        });
        socket.on('connect_error', (error) => {
          socketStatus.textContent = `Socket.io : erreur de connexion — ${error.message}`;
          appendSocketLog('connect_error', { message: error.message });
        });
        socket.on('new_order', (payload) => appendSocketLog('new_order', payload));
        socket.on('order_taken', (payload) => appendSocketLog('order_taken', payload));
      }

      zoneIdInput.addEventListener('change', connectSocket);
      connectSocket();

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const payload = {
          merchantId: merchantIdInput.value.trim(),
          deliveryAddress: deliveryAddressInput.value.trim(),
          deliveryLat: Number(deliveryLatInput.value),
          deliveryLng: Number(deliveryLngInput.value)
        };

        result.textContent = 'Envoi de la requête…';
        try {
          const response = await fetch(`${API_URL}/api/v1/orders`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const text = await response.text();
          let body;
          try {
            body = text === '' ? null : JSON.parse(text);
          } catch {
            body = text;
          }
          result.textContent = JSON.stringify({ statusCode: response.status, body }, null, 2);
        } catch (error) {
          result.textContent = JSON.stringify({
            statusCode: null,
            error: error instanceof Error ? error.message : String(error)
          }, null, 2);
        }
      });
    </script>
  </body>
</html>
